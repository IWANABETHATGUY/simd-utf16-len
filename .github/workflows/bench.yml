name: Benchmark

# Manual only: this times SIMD and std one after the other, so a shared runner
# that doubles one side fails changes that didn't touch the code. The Perf A/B
# workflow catches regressions on pull requests.
on:
  workflow_dispatch:

jobs:
  bench:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned so runner image and compiler updates don't show up as performance changes.
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Run benchmark comparison
        run: cargo run --release --example bench_compare
