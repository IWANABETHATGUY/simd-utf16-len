name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed measurement mode
        type: choice
        options:
          - simulation
          - walltime
        default: simulation

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    # Pinned so runner image and compiler updates don't show up as performance changes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: "1.98.1"
          cache-target: release
          bins: cargo-codspeed@5.0.2
      - name: Build the benchmark target(s)
        run: cargo codspeed build -m "${{ inputs.mode || 'simulation' }}"
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ inputs.mode || 'simulation' }}
          run: cargo codspeed run
